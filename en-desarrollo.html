<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MultiversoLabs — Espacio en Desarrollo</title>
  <style>
    :root {
      --bg-dark: #09080d;
      --glass-bg: rgba(15, 23, 42, 0.78);
      --glass-border: rgba(56, 189, 248, 0.25);
      --accent-cyan: #38bdf8;
      --accent-purple: #a855f7;
      --accent-gold: #fbbf24;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      margin: 0;
      overflow: hidden;
      background-color: var(--bg-dark);
    }

    /* Panel superior de telemetría y estado */
    #info {
      position: absolute;
      top: 20px;
      left: 20px;
      color: var(--accent-cyan);
      z-index: 100;
      background: var(--glass-bg);
      padding: 16px 22px;
      border-radius: 14px;
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
      pointer-events: none;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    #info h3 {
      margin: 0 0 6px 0;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
    }

    #info p {
      margin: 0 0 4px 0;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    #agente-status {
      color: #ff7b72 !important;
      font-weight: 600;
    }

    /* Tarjeta flotante inferior institucional */
    #maintenance-overlay {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      padding: 20px 28px;
      border-radius: 18px;
      backdrop-filter: blur(16px);
      color: var(--text-main);
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      max-width: 520px;
      width: 90%;
    }

    #maintenance-overlay h2 {
      margin: 0 0 8px 0;
      color: var(--accent-cyan);
      font-size: 1.15rem;
      font-weight: 700;
    }

    #maintenance-overlay p {
      margin: 0 0 14px 0;
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.5;
      min-height: 40px;
    }

    /* Botón de acción interactivo */
    .btn-action {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      color: white;
      border: none;
      padding: 11px 22px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
      text-decoration: none;
      display: inline-block;
      font-size: 0.9rem;
      box-shadow: 0 8px 25px rgba(56, 189, 248, 0.35);
    }

    .btn-action:hover {
      transform: translateY(-2px);
      opacity: 0.95;
      box-shadow: 0 12px 30px rgba(168, 85, 247, 0.45);
    }

    #countdown {
      color: var(--accent-gold);
      font-weight: bold;
    }

    /* Estilo personalizado para el panel de control gráfico (lil-gui) */
    .lil-gui {
      --background-color: rgba(15, 23, 42, 0.9) !important;
      --text-color: var(--text-main) !important;
      --title-background-color: rgba(22, 27, 34, 0.95) !important;
      border-radius: 12px !important;
      overflow: hidden;
      border: 1px solid var(--glass-border) !important;
      backdrop-filter: blur(14px);
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    }
  </style>
  
  <!-- Three.js + Controls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <!-- Control Panel GUI -->
  <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.18"></script>
</head>
<body>
  <!-- Panel de telemetría superior -->
  <div id="info">
    <h3 style="margin:0 0 5px 0;">MultiversoLabs // Core 3D</h3>
    <p id="status" style="margin:0 0 3px 0;">Iteraciones bucle While: 0</p>
    <p id="agente-status" style="margin:0;">Agente: Navegando...</p>
  </div>

  <!-- Tarjeta interactiva inferior con fases dinámicas y retorno -->
  <div id="maintenance-overlay">
    <h2 id="msg-title">Ecosistema Tecnológico & Artístico</h2>
    <p id="msg-desc">Cargando secuencias autónomas de desarrollo... Regreso automático en <span id="countdown">60</span>s.</p>
    <a href="index.html" class="btn-action">← Volver al Núcleo Principal</a>
  </div>

  <script>
    // --- LÓGICA DE SECUENCIAS Y REDIRECCIÓN AUTOMÁTICA (60s totales / 3 fases de 20s) ---
    let tiempoRestante = 60;
    const contadorElemento = document.getElementById('countdown');
    const msgTitle = document.getElementById('msg-title');
    const msgDesc = document.getElementById('msg-desc');

    const mensajesFases = [
      {
        title: "01. Simuladores de Vida Artificial",
        desc: "Exploramos modelos de enjambre y sistemas autónomos guiados por la creatividad humana y la proceduralidad."
      },
      {
        title: "02. Geometría & Arte Generativo",
        desc: "Construimos arquitecturas paramétricas tridimensionales que fusionan el cálculo matemático con la estética visual."
      },
      {
        title: "03. Plataforma en Evolución",
        desc: "Estamos esculpiendo los nuevos enlaces y herramientas interactivas de multiversolabs.space. ¡Pronto disponible!"
      }
    ];

    const intervaloRedireccion = setInterval(() => {
      tiempoRestante--;
      if(contadorElemento) contadorElemento.innerText = tiempoRestante;

      let faseActual = Math.floor((60 - tiempoRestante - 1) / 20);
      if (faseActual > 2) faseActual = 2;
      if (faseActual < 0) faseActual = 0;

      msgTitle.innerText = mensajesFases[faseActual].title;
      msgDesc.innerHTML = `${mensajesFases[faseActual].desc} Regreso automático en <span id="countdown">${tiempoRestante}</span>s.`;

      if (tiempoRestante === 40) {
        params.nivelesEsfera = 2;
        params.contraccion = 0.5;
        params.velocidadRotacion = 0.015;
        sincronizarGuiYEscena();
      } else if (tiempoRestante === 20) {
        params.nivelesEsfera = 3;
        params.contraccion = 0.0;
        params.velocidadRotacion = 0.025;
        sincronizarGuiYEscena();
      }

      if(tiempoRestante <= 0) {
        clearInterval(intervaloRedireccion);
        window.location.href = "index.html";
      }
    }, 1000);

    // Parámetros dinámicos controlados por el usuario / secuencias
    const params = {
      nivelesEsfera: 1,       
      radioBase: 2.2,         
      espaciado: 0.25,        
      velocidadRotacion: 0.008, 
      factorAtraccion: 0.05,  
      tolerancia: 0.001,
      contraccion: 1.0,
      animarBucle: false,
      mostrarEsferas: true,   
      velocidadAgente: 0.1,
      agenteActivo: true
    };

    // Configuración de Escena 3D
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(7, 6, 8);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const light = new THREE.DirectionalLight(0xffffff, 1.2);
    light.position.set(10, 20, 15);
    scene.add(light);

    let nodosSagrados = [];
    let conexionesSagradas = [];
    let lineasUnion = [];
    const grupoFlorVida = new THREE.Group();
    scene.add(grupoFlorVida);

    let agenteMesh;
    let agenteLuz;
    const agenteState = {
      indiceActual: 0,
      indiceObjetivo: 0,
      progreso: 0
    };

    const agenteGeo = new THREE.SphereGeometry(0.18, 16, 16);
    const agenteMat = new THREE.MeshBasicMaterial({ color: 0xff7b72 });
    agenteMesh = new THREE.Mesh(agenteGeo, agenteMat);
    
    agenteLuz = new THREE.PointLight(0xff7b72, 3, 4);
    agenteMesh.add(agenteLuz);
    scene.add(agenteMesh);

    function construirEstructura() {
      while(grupoFlorVida.children.length > 0){ 
        grupoFlorVida.remove(grupoFlorVida.children[0]); 
      }
      nodosSagrados = [];
      conexionesSagradas = [];
      lineasUnion = [];

      const direccionesBase = [
        new THREE.Vector3(0, 0, 0)
      ];

      for (let i = 0; i < 6; i++) {
        const ang = (i * Math.PI) / 3;
        direccionesBase.push(new THREE.Vector3(Math.cos(ang), 0, Math.sin(ang)));
      }
      for (let i = 0; i < 3; i++) {
        const ang = (i * 2 * Math.PI) / 3 + Math.PI / 6;
        const rHoriz = Math.sqrt(3) / 3;
        const hVert = Math.sqrt(2 / 3);
        direccionesBase.push(new THREE.Vector3(rHoriz * Math.cos(ang), hVert, rHoriz * Math.sin(ang)));
      }
      for (let i = 0; i < 3; i++) {
        const ang = (i * 2 * Math.PI) / 3 - Math.PI / 6;
        const rHoriz = Math.sqrt(3) / 3;
        const hVert = -Math.sqrt(2 / 3);
        direccionesBase.push(new THREE.Vector3(rHoriz * Math.cos(ang), hVert, rHoriz * Math.sin(ang)));
      }

      const puntosUnicos = [];
      const epsilon = 0.05;

      function agregarSiUnico(v) {
        for (let i = 0; i < puntosUnicos.length; i++) {
          if (puntosUnicos[i].distanceTo(v) < epsilon) return;
        }
        puntosUnicos.push(v);
      }

      agregarSiUnico(new THREE.Vector3(0, 0, 0));

      for (let nivel = 1; nivel <= params.nivelesEsfera; nivel++) {
        const actuales = [...puntosUnicos];
        actuales.forEach(base => {
          for (let d = 1; d < direccionesBase.length; d++) {
            const nuevo = base.clone().add(direccionesBase[d]);
            if (nuevo.length() <= params.nivelesEsfera + 0.15) {
              agregarSiUnico(nuevo);
            }
          }
        });
      }

      const distanciaBase = params.radioBase + params.espaciado;

      puntosUnicos.forEach((pNorm, idx) => {
        const pos = pNorm.clone().multiplyScalar(distanciaBase);

        const geomNodo = new THREE.BoxGeometry(0.28, 0.28, 0.28);
        const matNodo = new THREE.MeshPhongMaterial({
          color: idx === 0 ? 0xfbbf24 : 0x38bdf8,
          transparent: true,
          opacity: 0.9
        });
        const meshNodo = new THREE.Mesh(geomNodo, matNodo);
        meshNodo.position.copy(pos);

        const edges = new THREE.LineSegments(
          new THREE.EdgesGeometry(geomNodo),
          new THREE.LineBasicMaterial({ color: 0x000000 })
        );
        meshNodo.add(edges);

        let esferaMesh = null;
        if (params.mostrarEsferas) {
          const geomEsfera = new THREE.SphereGeometry(distanciaBase, 18, 14);
          const matEsfera = new THREE.MeshBasicMaterial({
            color: 0x38bdf8,
            wireframe: true,
            transparent: true,
            opacity: 0.12
          });
          esferaMesh = new THREE.Mesh(geomEsfera, matEsfera);
          meshNodo.add(esferaMesh);
        }

        grupoFlorVida.add(meshNodo);

        nodosSagrados.push({
          gridCoords: { id: idx, capa: Math.round(pNorm.length()) },
          mesh: meshNodo,
          material: matNodo,
          esferaMesh: esferaMesh,
          posBase: pos.clone(),
          posActual: pos.clone()
        });
      });

      const umbralUnion = distanciaBase * 1.08;
      for (let i = 0; i < nodosSagrados.length; i++) {
        for (let j = i + 1; j < nodosSagrados.length; j++) {
          const d = nodosSagrados[i].posBase.distanceTo(nodosSagrados[j].posBase);
          if (d <= umbralUnion) {
            conexionesSagradas.push([i, j]);

            const geomLinea = new THREE.BufferGeometry().setFromPoints([
              nodosSagrados[i].posBase,
              nodosSagrados[j].posBase
            ]);
            const matLinea = new THREE.LineBasicMaterial({
              color: 0x38bdf8,
              transparent: true,
              opacity: 0.45
            });
            const linea = new THREE.Line(geomLinea, matLinea);
            grupoFlorVida.add(linea);
            lineasUnion.push({ i, j, linea });
          }
        }
      }

      agenteState.indiceActual = 0;
      agenteState.indiceObjetivo = seleccionarNuevoNodo(0);
      agenteState.progreso = 0;

      actualizarTransformacion();
    }

    function seleccionarNuevoNodo(actualIdx) {
      const vecinos = [];
      conexionesSagradas.forEach(par => {
        if (par[0] === actualIdx) vecinos.push(par[1]);
        if (par[1] === actualIdx) vecinos.push(par[0]);
      });
      if (vecinos.length === 0) return (actualIdx + 1) % nodosSagrados.length;
      return vecinos[Math.floor(Math.random() * vecinos.length)];
    }

    function actualizarTransformacion() {
      let iteraciones = 0;
      let enEquilibrio = false;

      const tempPositions = nodosSagrados.map(n => n.posBase.clone());

      while (!enEquilibrio && iteraciones < 1000) {
        let maxMov = 0;
        
        for (let i = 0; i < tempPositions.length; i++) {
          const p = tempPositions[i];
          const base = nodosSagrados[i].posBase;
          
          const targetX = base.x * (1 - params.contraccion);
          const targetY = base.y * (1 - params.contraccion);
          const targetZ = base.z * (1 - params.contraccion);

          const dx = (targetX - p.x) * params.factorAtraccion;
          const dy = (targetY - p.y) * params.factorAtraccion;
          const dz = (targetZ - p.z) * params.factorAtraccion;

          p.x += dx;
          p.y += dy;
          p.z += dz;

          const mov = Math.sqrt(dx*dx + dy*dy + dz*dz);
          if (mov > maxMov) maxMov = mov;
        }

        iteraciones++;
        if (maxMov < params.tolerancia) enEquilibrio = true;
      }

      for (let i = 0; i < nodosSagrados.length; i++) {
        nodosSagrados[i].posActual.copy(tempPositions[i]);
        nodosSagrados[i].mesh.position.copy(tempPositions[i]);
        if (nodosSagrados[i].esferaMesh) {
          const escalaEsfera = 1 - params.contraccion * 0.85;
          nodosSagrados[i].esferaMesh.scale.set(escalaEsfera, escalaEsfera, escalaEsfera);
        }
      }

      lineasUnion.forEach(u => {
        u.linea.geometry.setFromPoints([
          nodosSagrados[u.i].posActual,
          nodosSagrados[u.j].posActual
        ]);
      });

      document.getElementById('status').innerText = `Iteraciones bucle While: ${iteraciones}`;
    }

    function actualizarAgente() {
      if (!params.agenteActivo || nodosSagrados.length === 0) return;

      agenteState.progreso += params.velocidadAgente;

      const origenLocal = nodosSagrados[agenteState.indiceActual].posActual;
      const destinoLocal = nodosSagrados[agenteState.indiceObjetivo].posActual;

      const posLocal = new THREE.Vector3().lerpVectors(origenLocal, destinoLocal, agenteState.progreso);
      agenteMesh.position.copy(posLocal).applyMatrix4(grupoFlorVida.matrixWorld);

      nodosSagrados.forEach((nodo) => {
        const posMundialNodo = nodo.posActual.clone().applyMatrix4(grupoFlorVida.matrixWorld);
        const d = agenteMesh.position.distanceTo(posMundialNodo);
        if (d < 1.1) {
          nodo.material.color.setHex(0xff7b72);
          nodo.material.opacity = 1.0;
        } else {
          nodo.material.color.setHex(nodo.gridCoords.id === 0 ? 0xfbbf24 : 0x38bdf8);
          nodo.material.opacity = 0.85;
        }
      });

      if (agenteState.progreso >= 1) {
        agenteState.progreso = 0;
        agenteState.indiceActual = agenteState.indiceObjetivo;
        agenteState.indiceObjetivo = seleccionarNuevoNodo(agenteState.indiceActual);
        
        const info = nodosSagrados[agenteState.indiceActual].gridCoords;
        document.getElementById('agente-status').innerText = `Agente: Nodo #${info.id} (Capa ${info.capa})`;
      }
    }

    // Panel de Control Visual (lil-gui estilizado)
    const gui = new lil.GUI({ title: 'Configuración 3D' });
    gui.domElement.style.position = 'absolute';
    gui.domElement.style.top = '20px';
    gui.domElement.style.right = '20px';

    const folderEstructura = gui.addFolder('Geometría Sagrada');
    folderEstructura.add(params, 'nivelesEsfera', 1, 3, 1).name('Capas').onChange(construirEstructura);
    folderEstructura.add(params, 'espaciado', 0.0, 2.0, 0.05).name('Expansión').onChange(construirEstructura);
    folderEstructura.add(params, 'mostrarEsferas').name('Esferas').onChange(construirEstructura);
    folderEstructura.add(params, 'velocidadRotacion', 0.0, 0.05, 0.001).name('Rotación');

    const folderMovimiento = gui.addFolder('Contracción');
    folderMovimiento.add(params, 'contraccion', 0.0, 1.0, 0.01).name('Origen').onChange(actualizarTransformacion);
    folderMovimiento.add(params, 'factorAtraccion', 0.01, 0.3, 0.01).name('Fuerza').onChange(actualizarTransformacion);
    folderMovimiento.add(params, 'animarBucle').name('Animar');

    const folderAgente = gui.addFolder('Agente Visual');
    folderAgente.add(params, 'agenteActivo').name('Activo');
    folderAgente.add(params, 'velocidadAgente', 0.01, 0.3, 0.01).name('Velocidad');

    function sincronizarGuiYEscena() {
      construirEstructura();
      actualizarTransformacion();
      gui.controllers.forEach(c => c.updateDisplay());
      gui.folders.forEach(f => f.controllers.forEach(c => c.updateDisplay()));
    }

    construirEstructura();

    function animate() {
      requestAnimationFrame(animate);

      if (params.velocidadRotacion > 0) {
        grupoFlorVida.rotation.y += params.velocidadRotacion;
        grupoFlorVida.rotation.x += params.velocidadRotacion * 0.5;
        grupoFlorVida.updateMatrixWorld();
      }

      if (params.animarBucle) {
        params.contraccion = (Math.sin(Date.now() * 0.002) + 1) / 2;
        const controller = gui.controllers.find(c => c.property === 'contraccion');
        if(controller) controller.updateDisplay();
        actualizarTransformacion();
      }

      actualizarAgente();

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
